[project]
name = "sequoia-x"
version = "3.0.0"  # 2.x 仅 CLI，3.0 起为常驻 HTTP 服务：形态变更，算 major（T3 §4.2）
requires-python = ">=3.10"
dependencies = [
    "akshare>=1.10",
    "baostock>=0.9",
    "fastapi>=0.115",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "pandas>=2.0",
    "requests>=2.31",
    "uvicorn[standard]>=0.30",
    # T4 定时调度：4.x API 与 3.x 差异大，锁 3.x（任务书 T4 §4.1）
    "apscheduler>=3.10,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "pytest-mock>=3.12",
    # TestClient（starlette）内部基于 httpx，T3 路由测试必需
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
